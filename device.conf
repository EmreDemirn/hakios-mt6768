# devices/merlinx/device.conf: Xiaomi Redmi Note 9 (merlinx)
device merlinx
	title	Xiaomi Redmi Note 9 (merlinx)
	vendor	Xiaomi
	soc	mt6768
	defconfig	merlinx_defconfig
	maintainer	the HakiOS developers
	status display works 1080x2340
	status touch works Novatek NT36672A (touchscreen=3)
	status buttons works power and volume, keypad at 0x10010000 (buttons=2)
	status cpu works 4 cores, big cores clocked (cpus=4 mtk_cpufreq=3)
	status gpu works Mali-G52 MC2 (mali=1)
	status storage partial the system image read off the eMMC, read only (emmc_root=1)
